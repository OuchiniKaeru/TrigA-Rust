[package]
name = "TrigA"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "automation_manager"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
cron = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "fs"] }
notify = "8"
axum = { version = "0.8", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
